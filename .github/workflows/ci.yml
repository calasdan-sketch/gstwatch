name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest build twine
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: gstwatch --version
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Install the built wheel into a clean environment and run it
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -d "$RUNNER_TEMP/clean/Scripts" ]; then B="$RUNNER_TEMP/clean/Scripts"; else B="$RUNNER_TEMP/clean/bin"; fi
          "$B/pip" install dist/*.whl
          "$B/gstwatch" --version
          "$B/python" -m gstwatch check --quarter 2026Q1=8000 --json
